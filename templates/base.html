{% load static %} 

<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}GameCo{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <header class="navbar">
        <a href="{% url 'home' %}" class="logo">
            <h1><span class="gold">Game</span><span class="white">Co</span></h1>
        </a>
      
        <nav>
            <a href="{% url 'home' %}">Home</a>
            <a href="{% url 'token_game' %}">Token&nbsp;Game</a>
        </nav>
      </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        © {% now "Y" %} GameCo – All rights reserved.
    </footer>
    
</body>
</html>
